name: "🎨 [UI-TASK] New Design or Versioned Enhancement (Auto-Directory) | ثبت تسک و ساخت خودکار دایرکتوری"
description: "Auto-generate bilingual READMEs & directories (<cat>/<plat>/<theme>/<dir>/<slug>/<lang>/) or versioned v2/v3 enhancements."
title: "[UI-TASK]: "
labels: ["ui-task"]
body:
  - type: markdown
    attributes:
      value: |
        ### International UI/UX Task Specification | مشخصات استاندارد تسک رابط کاربری
        - **EN:** Submitting this issue automatically scaffolds target directories (`<category>/<platform>/<theme>/<direction>/<slug>/<lang>/README.md`) via a Pull Request to `main`. `rtl` is always included by default.
        - **FA:** با ثبت این ایشو، دایرکتوری‌ها و فایل‌های `README.md` به صورت خودکار در یک Pull Request به شاخه `main` ایجاد می‌شوند. نسخه `rtl` همیشه به صورت پیش‌فرض ساخته می‌شود.

  - type: dropdown
    id: task_type
    attributes:
      label: "Task Type | نوع فعالیت"
      description: "EN: Choose 'enhance-existing' to auto-create the next version (v2, v3...) alongside existing files. | FA: برای توسعه طرح موجود گزینه دوم را انتخاب کنید تا نسخه جدید (v2, v3...) بدون حذف فایل‌های قبلی ساخته شود."
      options:
        - "new-directory (Create new design directory | ایجاد طرح و دایرکتوری جدید)"
        - "enhance-existing (Develop existing directory with auto-versioning v2, v3... | توسعه دایرکتوری موجود با نسخه‌بندی خودکار)"
    validations:
      required: true

  - type: input
    id: target_version
    attributes:
      label: "Target Release Version | نسخه هدف پروژه"
      description: "EN: Semantic version or milestone (e.g., v1.4.0). | FA: شماره نسخه مرتبط متارنگ (مثال: v1.4.0)."
      placeholder: "v1.4.0"
    validations:
      required: true

  - type: input
    id: dir_slug
    attributes:
      label: "Directory Slug | نام دایرکتوری (اسلاگ)"
      description: "EN: Lowercase English, numbers, and hyphens only (e.g., first-page). CANNOT be changed after creation! | FA: فقط حروف کوچک انگلیسی، اعداد و خط تیره (مثال: first-page). پس از ثبت، تغییر اسلاگ از طریق ویرایش ایشو غیرمجاز است!"
      placeholder: "first-page"
    validations:
      required: true

  - type: checkboxes
    id: categories
    attributes:
      label: "Categories & Platforms | دسته‌بندی و پلتفرم‌ها"
      description: "EN: Select one or more target platforms. | FA: یک یا چند بستر هدف را انتخاب کنید."
      options:
        - label: "01-external-index/web-desktop"
        - label: "01-external-index/web-mobile"
        - label: "02-internal-index/web-desktop"
        - label: "02-internal-index/web-mobile"
        - label: "03-3d-environments/web-desktop"
        - label: "03-3d-environments/web-mobile"
        - label: "03-3d-environments/webgl-desktop"
        - label: "03-3d-environments/webgl-mobile"
        - label: "03-3d-environments/vr-headset"

  - type: checkboxes
    id: themes
    attributes:
      label: "Themes | تم‌های رنگی"
      description: "EN: Select at least one theme. | FA: حداقل یک تم انتخاب کنید."
      options:
        - label: "theme:dark"
        - label: "theme:light"

  - type: checkboxes
    id: directions
    attributes:
      label: "Layout Directions | جهت چیدمان"
      description: "EN: RTL is ALWAYS generated by default. Check LTR if needed. | FA: نسخه RTL همیشه به صورت پیش‌فرض ساخته می‌شود. در صورت نیاز LTR را تیک بزنید."
      options:
        - label: "dir:rtl (Default / Always Included)"
        - label: "dir:ltr"

  - type: checkboxes
    id: languages
    attributes:
      label: "Languages (Subdirectories) | زبان‌ها (ایجاد زیرپوشه مجزا)"
      description: "EN: A dedicated subdirectory (fa / en) will be created for each selected language. | FA: برای هر زبان انتخاب‌شده، زیرپوشه اختصاصی (fa / en) ساخته می‌شود."
      options:
        - label: "lang:fa"
        - label: "lang:en"

  - type: textarea
    id: spec_en
    attributes:
      label: "Task Description (English) | توضیحات تسک (انگلیسی)"
      description: "EN: Detailed UI/UX requirements, states (Default/Hover/Active/Loading/Empty), and acceptance criteria in English (written to README.md). | FA: شرح کامل نیازمندی‌ها و معیارهای پذیرش به زبان انگلیسی."
      placeholder: "Describe goals, user flows, UI states, and acceptance criteria..."
    validations:
      required: true

  - type: textarea
    id: spec_fa
    attributes:
      label: "Task Description (Persian) | توضیحات تسک (فارسی)"
      description: "EN: Detailed UI/UX requirements in Persian (written to README.md). | FA: شرح دقیق صفحه، اجزای رابط کاربری، حالت‌ها و معیارهای پذیرش به زبان فارسی."
      placeholder: "شرح دقیق صفحه، اجزای رابط کاربری، حالت‌ها و معیارهای پذیرش..."
    validations:
      required: true
